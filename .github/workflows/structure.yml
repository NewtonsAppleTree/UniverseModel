name: Structure, model rules and universal framework

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_structure.py
      - run: python tools/check_model_rules.py
      - run: python -m unittest discover -s tests/chipmodel -p "test_*.py" -v
      - run: python -m unittest discover -s tests/integration -p "test_*.py" -v
      - run: python -m example.adc_demo
      - run: python -m example.chipmodel_demo
      - run: python -m example.universal_demo --case adc
      - run: python -m example.universal_demo --case dma --set inputs.payload_bytes=64
      - run: python -m pip wheel . --no-deps --wheel-dir .build/wheels
