name: Structure, model rules and universal framework

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_structure.py
      - run: python tools/check_model_rules.py
      - run: python -m unittest discover -s tests/contracts -p "test_*.py" -v
      - run: python -m unittest discover -s tests/clustermodel -p "test_*.py" -v
      - run: python -m unittest discover -s tests/costmodel -p "test_*.py" -v
      - run: python -m unittest discover -s tests/chipmodel -p "test_*.py" -v
      - run: python -m unittest discover -s tests/workloads -p "test_*.py" -v
      - run: python -m unittest discover -s compiler/tests -p "test_*.py" -v
      - run: python -m unittest discover -s tests/integration -p "test_*.py" -v
      - run: python -m example.adc_demo
      - run: python -m example.chipmodel_demo
      - run: python -m example.universal_demo --case adc
      - run: python -m example.universal_demo --case dma --set inputs.payload_bytes=64
      - run: python -m example.network_demo --output .build/network-c1
      - run: python -m example.network_demo --read .build/network-c1
      - run: python -m example.cluster_demo --output .build/cluster-foundation
      - run: python -m example.cluster_demo --read .build/cluster-foundation
      - run: python -m example.cluster_demo --config config/experiments/cluster_leaf_spine.json --output .build/cluster-breadth
      - run: python -m example.cluster_demo --read .build/cluster-breadth --overview
      - run: python -m example.linear_demo --output .build/linear-study
      - run: python -m example.linear_demo --read .build/linear-study
      - run: python tools/validate_chipmodel.py --output .build/chipmodel-acceptance
      - run: python tools/validate_chipmodel.py --read .build/chipmodel-acceptance
      - run: python -m example.training_demo --output .build/training-study
      - run: python -m example.training_demo --read .build/training-study
      - run: python tools/validate_workloads.py --output .build/workloads-acceptance
      - run: python tools/validate_workloads.py --read .build/workloads-acceptance
      - run: python -m pip wheel . --no-deps --wheel-dir .build/wheels

  training-torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-training-torch.txt
      - run: python -m pip install -r tools/requirements-training-torch.txt
      - run: python -m unittest discover -s tests/integration -p "test_training_experiment.py" -v
      - run: python -m example.training_demo --torch-reference --output .build/training-pytorch

  workloads-numpy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-workloads-numpy.txt
      - run: python -m unittest discover -s tests/integration -p "test_retrieval_experiment.py" -v
      - run: python tools/validate_workloads.py --numpy-reference --output .build/workloads-numpy
      - run: python tools/validate_workloads.py --read .build/workloads-numpy
